<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Car</title>
</head>

<body>

<h2>Edit Car</h2>

<form th:action="@{/admin/car/edit/finish}" method="post">

    <input type="hidden" name="carId" th:value="${carDTO.id}">
    <input type="hidden" name="apiKey" th:value="${apiKey}">

    <label>Type:</label>
    <input type="text" name="type" th:value="${carDTO.type}" required>
    <br><br>
    <label>Daily price:</label>
    <input type="number" name="price" th:value="${carDTO.price}" min="0" required>
    <br><br>
    <label>Image:</label>
    <input type="text" name="picture" th:value="${carDTO.picture}">
    <br><br>
    <label>Active:</label>
    <select name="active">
        <option value="true" th:selected="${carDTO.active}">Yes</option>
        <option value="false" th:selected="${!carDTO.active}">No</option>
    </select>
    <br><br>

    <button type="submit">Save changes</button>
</form>

<br>

<a th:href="@{/(apiKey=${apiKey})}">Back to admin page</a>

</body>
</html>
