<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Reservation</title>
</head>
<body>

<h2>Reservation datas</h2>

<form action="/cars/res/finish" method="post">

    <h3>Personal datas</h3>

    <label>Name:</label>
    <input type="text" name="name" required>
    <br><br>

    <label >E-mail:</label>
    <input type="email" name="email" required>
    <br><br>

    <label>Address:</label>
    <input type="text" name="address" required>
    <br><br>

    <label>Phone:</label>
    <input type="tel" name="phone" required>
    <br><br>

    <h3>Details of the selected car</h3>

    <input type="hidden"
           name="userSelectionDTO.carId"
           th:value="${selectedCarForResPageDTO.carId}">

    <input type="hidden"
           name="userSelectionDTO.resDateDTO.startDate"
           th:value="${selectedCarForResPageDTO.resDateDTO.startDate}">

    <input type="hidden"
           name="userSelectionDTO.resDateDTO.endDate"
           th:value="${selectedCarForResPageDTO.resDateDTO.endDate}">

    <button type="submit">Reserve it!</button>

</form>

</body>
</html>
